/* estrazione testo con coordinate */
async function extract(buf){const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise,pages=[];

async function addFiles(fs){for(const f of fs){try{const buf=await f.arrayBuffer(),c=parse(await extract(buf));c.fn=f.name;
await tx('pdf','readwrite',s=>s.put(buf,c.id));await tx('ced','readwrite',s=>s.put(c));

const sorted=()=>[...C].sort((a,b)=>a.mese.localeCompare(b.mese)||a.tipo.localeCompare(b.tipo));
